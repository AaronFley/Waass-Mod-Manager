name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: python -m compileall -q core server.py run.py tools build.py

      - name: 全部测试
        shell: bash
        run: |
          fail=0
          for f in tests/test_*.py; do
            if python "$f" > "/tmp/$(basename "$f").log" 2>&1; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              tail -30 "/tmp/$(basename "$f").log"
              fail=1
            fi
          done
          echo "共 $(ls tests/test_*.py | wc -l) 套"
          exit $fail

      # 第一次跑 CI 就是这一步全红：windows-latest 是英文镜像，控制台代码页
      # cp1252，中文一 print 就 UnicodeEncodeError，28 套里 20 多套「失败」。
      # 本机是中文系统（cp936）看不见。这条固定住，别让它再回来。
      - name: 英文控制台（cp1252）里的中文输出
        shell: bash
        env:
          PYTHONIOENCODING: cp1252
        run: |
          python tests/test_console.py
          python tests/test_lifecycle.py
          python run.py --check --check-out build/execheck-cp1252.json
          test -s build/execheck-cp1252.json

      - name: 冷启动（有游戏）
        run: python tools/coldstart.py

      - name: 冷启动（没装游戏）
        run: python tools/coldstart.py --no-game

      - name: 能力自检（源码态）
        run: python run.py --check --check-out build/execheck-src.json
